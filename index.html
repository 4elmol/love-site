<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1001 причина гулять со мной ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #0d0b1a, #1b1236, #281d47);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 138, 172, 0.05) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(192, 132, 252, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 35px 30px;
            max-width: 880px;
            width: 100%;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .tabs {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.02);
            padding: 6px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .tab-btn:hover {
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.03);
        }
        .tab-btn.active {
            background: rgba(255, 138, 172, 0.12);
            color: #ff8aac;
            box-shadow: 0 0 30px rgba(255, 138, 172, 0.05);
        }

        .page {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        h1 {
            background: linear-gradient(135deg, #ff8aac, #c084fc, #7aa9ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 40px rgba(255, 138, 172, 0.08));
        }
        .sub {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.8rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-weight: 300;
        }
        .counter {
            display: inline-block;
            background: rgba(255, 138, 172, 0.06);
            border: 1px solid rgba(255, 138, 172, 0.08);
            color: #ff8aac;
            font-weight: 500;
            font-size: 0.75rem;
            padding: 4px 20px;
            border-radius: 40px;
            letter-spacing: 1.5px;
            margin-bottom: 22px;
            backdrop-filter: blur(10px);
        }

        #card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 28px;
            padding: 42px 28px;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            border-left: 3px solid #ff8aac;
            box-shadow: inset 0 0 60px rgba(255, 138, 172, 0.02),
                        0 10px 40px rgba(0, 0, 0, 0.2);
            transition: 0.3s ease;
        }
        #card:hover {
            border-left-color: #c084fc;
            box-shadow: inset 0 0 60px rgba(192, 132, 252, 0.03);
        }
        #reasonText {
            color: #f2ecff;
            font-size: 1.5rem;
            line-height: 1.5;
            font-weight: 300;
            transition: opacity 0.2s ease;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
            width: 100%;
        }
        .btn-row button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #d6ccf0;
            padding: 12px 34px;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: 400;
            letter-spacing: 0.3px;
            white-space: nowrap;
            min-width: 110px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        .btn-row button::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 138, 172, 0.2), rgba(192, 132, 252, 0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            opacity: 0;
            transition: 0.3s ease;
        }
        .btn-row button:hover::before {
            opacity: 1;
        }
        .btn-row button:hover {
            background: rgba(255, 138, 172, 0.06);
            border-color: rgba(255, 138, 172, 0.15);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 138, 172, 0.06);
        }
        .btn-row button:active {
            transform: scale(0.97);
        }

        .search-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
            width: 100%;
        }
        .search-row input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #f2ecff;
            padding: 10px 18px;
            border-radius: 60px;
            font-size: 0.85rem;
            width: 140px;
            text-align: center;
            outline: none;
            transition: 0.3s ease;
            height: 44px;
            backdrop-filter: blur(10px);
        }
        .search-row input:focus {
            border-color: #ff8aac;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 30px rgba(255, 138, 172, 0.04);
        }
        .search-row input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }
        .search-row input[type=number]::-webkit-outer-spin-button,
        .search-row input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .search-row input[type=number] {
            -moz-appearance: textfield;
            appearance: none;
        }

        .search-row button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #d6ccf0;
            padding: 10px 22px;
            border-radius: 60px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s ease;
            white-space: nowrap;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            backdrop-filter: blur(10px);
        }
        .search-row button:hover {
            background: rgba(255, 138, 172, 0.06);
            border-color: rgba(255, 138, 172, 0.15);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 138, 172, 0.06);
        }
        .search-row .search-result {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.8rem;
            min-width: 50px;
            text-align: center;
            font-weight: 300;
        }

        .carousel-wrapper {
            width: 100%;
            overflow: hidden;
            border-radius: 20px;
            margin-bottom: 22px;
            background: rgba(0, 0, 0, 0.12);
            padding: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .carousel-track {
            display: flex;
            gap: 14px;
            animation: scrollPhotos 20s linear infinite;
            width: max-content;
        }
        .carousel-track img {
            height: 100px;
            width: 150px;
            object-fit: cover;
            border-radius: 14px;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.02);
            transition: 0.3s ease;
            filter: brightness(0.85) saturate(0.9);
        }
        .carousel-track img:hover {
            transform: scale(1.05);
            border-color: rgba(255, 138, 172, 0.2);
            filter: brightness(1) saturate(1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        @keyframes scrollPhotos {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .carousel-wrapper:hover .carousel-track {
            animation-play-state: paused;
        }

        #progressWrap {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff8aac, #c084fc, #7aa9ff);
            transition: width 0.8s ease;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 138, 172, 0.1);
        }
        .footer {
            color: rgba(255, 255, 255, 0.02);
            margin-top: 14px;
            font-size: 0.6rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .note-app {
            text-align: left;
            margin-top: 6px;
        }
        .note-app .note-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .note-app .note-input-area textarea {
            flex: 1;
            min-height: 60px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            color: #f2ecff;
            font-size: 0.95rem;
            padding: 14px 18px;
            font-family: inherit;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            transition: 0.3s ease;
            min-width: 150px;
        }
        .note-app .note-input-area textarea:focus {
            border-color: rgba(192, 132, 252, 0.2);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 30px rgba(192, 132, 252, 0.03);
        }
        .note-app .note-input-area textarea::placeholder {
            color: rgba(255, 255, 255, 0.08);
        }
        .note-app .note-input-area .note-add-btn {
            background: rgba(255, 138, 172, 0.06);
            border: 1px solid rgba(255, 138, 172, 0.08);
            color: #ff8aac;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s ease;
            white-space: nowrap;
            height: fit-content;
            align-self: flex-end;
            backdrop-filter: blur(10px);
        }
        .note-app .note-input-area .note-add-btn:hover {
            background: rgba(255, 138, 172, 0.10);
            border-color: rgba(255, 138, 172, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 138, 172, 0.06);
        }

        .note-app .note-search-area {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .note-app .note-search-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #f2ecff;
            padding: 10px 18px;
            border-radius: 60px;
            font-size: 0.85rem;
            outline: none;
            transition: 0.3s ease;
        }
        .note-app .note-search-area input:focus {
            border-color: rgba(192, 132, 252, 0.15);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 30px rgba(192, 132, 252, 0.03);
        }
        .note-app .note-search-area input::placeholder {
            color: rgba(255, 255, 255, 0.08);
        }

        .note-app .note-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .note-app .note-list::-webkit-scrollbar {
            width: 4px;
        }
        .note-app .note-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
            border-radius: 10px;
        }
        .note-app .note-list::-webkit-scrollbar-thumb {
            background: rgba(255, 138, 172, 0.15);
            border-radius: 10px;
        }

        .note-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            transition: 0.3s ease;
            position: relative;
            backdrop-filter: blur(10px);
        }
        .note-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
            transform: translateX(4px);
        }
        .note-item.pinned {
            border-left: 3px solid #ff8aac;
            background: rgba(255, 138, 172, 0.03);
        }
        .note-item .note-text {
            color: #f2ecff;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            flex: 1;
        }
        .note-item .note-textarea-edit {
            display: none;
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 138, 172, 0.1);
            border-radius: 14px;
            color: #f2ecff;
            font-size: 0.95rem;
            padding: 10px 14px;
            font-family: inherit;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            min-height: 40px;
        }
        .note-item .note-textarea-edit:focus {
            border-color: rgba(192, 132, 252, 0.2);
            box-shadow: 0 0 30px rgba(192, 132, 252, 0.03);
        }
        .note-item.editing .note-text {
            display: none;
        }
        .note-item.editing .note-textarea-edit {
            display: block;
        }

        .note-item .note-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .note-item .note-actions button {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.3s ease;
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }
        .note-item .note-actions button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .note-item .note-actions .pin-btn:hover {
            border-color: #ff8aac;
            color: #ff8aac;
        }
        .note-item .note-actions .pin-btn.pinned {
            border-color: #ff8aac;
            color: #ff8aac;
            background: rgba(255, 138, 172, 0.06);
        }
        .note-item .note-actions .edit-btn:hover {
            border-color: #c084fc;
            color: #c084fc;
        }
        .note-item .note-actions .delete-btn:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        .note-item .note-actions .save-edit-btn {
            border-color: rgba(132, 255, 132, 0.1);
            color: rgba(132, 255, 132, 0.3);
        }
        .note-item .note-actions .save-edit-btn:hover {
            border-color: #84ff84;
            color: #84ff84;
        }
        .note-item .note-actions .cancel-edit-btn:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .note-app .note-empty {
            color: rgba(255, 255, 255, 0.06);
            text-align: center;
            padding: 30px 0;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .note-app .note-count {
            color: rgba(255, 255, 255, 0.04);
            font-size: 0.7rem;
            text-align: right;
            margin-top: 12px;
            letter-spacing: 1px;
        }

        @media (max-width: 640px) {
            .container { padding: 20px 16px; border-radius: 32px; }
            h1 { font-size: 1.8rem; }
            #reasonText { font-size: 1.15rem; }
            #card { padding: 28px 18px; min-height: 140px; border-radius: 20px; }
            .carousel-track img { height: 70px; width: 105px; border-radius: 10px; }

            .btn-row { gap: 8px; }
            .btn-row button { padding: 10px 20px; font-size: 0.8rem; min-width: 80px; }

            .search-row { gap: 6px; }
            .search-row input { width: 90px; font-size: 0.8rem; height: 38px; padding: 8px 12px; }
            .search-row button { height: 38px; font-size: 0.8rem; padding: 8px 14px; min-width: 60px; }
            .search-row .search-result { font-size: 0.7rem; min-width: 40px; }

            .tabs { gap: 4px; padding: 4px; border-radius: 40px; }
            .tab-btn { padding: 8px 14px; font-size: 0.75rem; }

            .note-app .note-input-area { flex-direction: column; }
            .note-app .note-input-area .note-add-btn { align-self: stretch; }
            .note-item { padding: 12px 14px; border-radius: 14px; flex-wrap: wrap; }
            .note-item .note-actions { margin-top: 6px; width: 100%; justify-content: flex-end; }
            .note-app .note-input-area textarea { min-height: 50px; padding: 12px 14px; font-size: 0.9rem; border-radius: 14px; }
            .note-app .note-search-area input { font-size: 0.8rem; padding: 8px 14px; border-radius: 40px; }
            .note-item .note-text { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="tabs">
            <button class="tab-btn active" data-page="main">💕 Главная</button>
            <button class="tab-btn" data-page="notes">📝 Заметки</button>
            <button class="tab-btn" data-page="wishes">🌟 Пожелания</button>
        </div>

        <div class="page active" id="page-main">

            <h1>1001 причина</h1>
            <div class="sub">пойти гулять со мной</div>

            <div class="counter" id="counterDisplay">1 / 1001</div>

            <div id="card">
                <div id="reasonText">Нажми «Новая» ✦</div>
            </div>

            <div class="btn-row">
                <button id="randomBtn">✦ Новая</button>
                <button id="nextBtn">→ Дальше</button>
            </div>

            <div class="search-row">
                <input type="number" id="searchInput" placeholder="№ причины" min="1" max="1001" />
                <button id="searchBtn">🔍 Найти</button>
                <span class="search-result" id="searchResult"></span>
            </div>

            <div class="carousel-wrapper">
                <div class="carousel-track" id="photoTrack"></div>
            </div>

            <div id="progressWrap">
                <div id="progressFill"></div>
            </div>
            <div class="footer">для тебя</div>
        </div>

        <div class="page" id="page-notes">
            <h1>📝 Заметки</h1>
            <div class="sub">записывай свои мысли</div>
            <div class="note-app" id="notesApp">
                <div class="note-input-area">
                    <textarea id="notesInput" placeholder="Напиши заметку..."></textarea>
                    <button class="note-add-btn" id="notesAddBtn">➕ Добавить</button>
                </div>
                <div class="note-search-area">
                    <input type="text" id="notesSearch" placeholder="🔍 Поиск заметок..." />
                </div>
                <div class="note-list" id="notesList"></div>
                <div class="note-count" id="notesCount">0 заметок</div>
            </div>
        </div>

        <div class="page" id="page-wishes">
            <h1>🌟 Пожелания</h1>
            <div class="sub">что ты хочешь мне сказать</div>
            <div class="note-app" id="wishesApp">
                <div class="note-input-area">
                    <textarea id="wishesInput" placeholder="Напиши пожелание..."></textarea>
                    <button class="note-add-btn" id="wishesAddBtn">➕ Добавить</button>
                </div>
                <div class="note-search-area">
                    <input type="text" id="wishesSearch" placeholder="🔍 Поиск пожеланий..." />
                </div>
                <div class="note-list" id="wishesList"></div>
                <div class="note-count" id="wishesCount">0 пожеланий</div>
            </div>
        </div>

    </div>

    <script src="reasons.js"></script>
    <script>
        const photos = [
            "images/photo1.jpg",
            "images/photo2.jpg",
            "images/photo3.jpg",
            "images/photo4.jpg",
            "images/photo5.jpg",
            "images/photo6.jpg",
            "images/photo7.jpg",
            "images/photo8.jpg",
            "images/photo9.jpg",
            "images/photo10.jpg",
            "images/photo11.jpg",
            "images/photo12.jpg",
            "images/photo13.jpg",
            "images/photo14.jpg",
            "images/photo15.jpg",
            "images/photo16.jpg",
            "images/photo17.jpg",
            "images/photo18.jpg"
        ];

        const track = document.getElementById('photoTrack');
        const allPhotos = [...photos, ...photos];
        allPhotos.forEach(src => {
            const img = document.createElement('img');
            img.src = src;
            img.alt = 'Красивое фото';
            img.loading = 'lazy';
            track.appendChild(img);
        });

        let currentIndex = 0;
        const reasonText = document.getElementById('reasonText');
        const counterDisplay = document.getElementById('counterDisplay');
        const progressFill = document.getElementById('progressFill');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const searchResult = document.getElementById('searchResult');

        function showReason(index) {
            const safe = index % finalReasons.length;
            currentIndex = safe;
            reasonText.textContent = finalReasons[safe];
            counterDisplay.textContent = `${safe + 1} / ${finalReasons.length}`;
            progressFill.style.width = ((safe + 1) / finalReasons.length * 100) + '%';
            reasonText.style.opacity = '0';
            setTimeout(() => reasonText.style.opacity = '1', 140);
            searchResult.textContent = '';
            searchInput.value = '';
        }

        document.getElementById('randomBtn').addEventListener('click', () => {
            showReason(Math.floor(Math.random() * finalReasons.length));
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            showReason((currentIndex + 1) % finalReasons.length);
        });

        function searchByNumber() {
            const num = parseInt(searchInput.value);
            if (!num || num < 1 || num > finalReasons.length) {
                searchResult.textContent = '❌';
                searchResult.style.color = 'rgba(255,100,100,0.6)';
                return;
            }
            const index = num - 1;
            showReason(index);
            searchResult.textContent = `✅ #${num}`;
            searchResult.style.color = 'rgba(132,255,132,0.6)';
        }

        searchBtn.addEventListener('click', searchByNumber);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchByNumber();
        });

        const tabBtns = document.querySelectorAll('.tab-btn');
        const pages = {
            main: document.getElementById('page-main'),
            notes: document.getElementById('page-notes'),
            wishes: document.getElementById('page-wishes')
        };

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                Object.values(pages).forEach(p => p.classList.remove('active'));

                btn.classList.add('active');
                const pageId = btn.dataset.page;
                pages[pageId].classList.add('active');
            });
        });

        function createNoteApp(config) {
            const {
                storageKey,
                listId,
                inputId,
                addBtnId,
                searchId,
                countId,
                placeholder,
                label
            } = config;

            const list = document.getElementById(listId);
            const input = document.getElementById(inputId);
            const addBtn = document.getElementById(addBtnId);
            const search = document.getElementById(searchId);
            const countEl = document.getElementById(countId);

            let notes = [];
            let editingId = null;
            let searchQuery = '';

            function loadNotes() {
                const saved = localStorage.getItem(storageKey);
                if (saved) {
                    try {
                        notes = JSON.parse(saved);
                    } catch (e) {
                        notes = [];
                    }
                } else {
                    notes = [];
                }
                notes = notes.map(n => ({ ...n, pinned: n.pinned || false }));
                render();
            }

            function saveNotes() {
                localStorage.setItem(storageKey, JSON.stringify(notes));
                render();
            }

            function addNote() {
                const text = input.value.trim();
                if (!text) return;
                const newNote = { id: Date.now(), text: text, pinned: false };
                notes.unshift(newNote);
                input.value = '';
                saveNotes();
            }

            function deleteNote(id) {
                notes = notes.filter(n => n.id !== id);
                saveNotes();
            }

            function togglePin(id) {
                const note = notes.find(n => n.id === id);
                if (note) {
                    note.pinned = !note.pinned;
                    notes.sort((a, b) => (b.pinned - a.pinned) || (a.id - b.id));
                    saveNotes();
                }
            }

            function startEdit(id) {
                editingId = id;
                render();
                const item = document.querySelector(`#${listId} .note-item[data-id="${id}"]`);
                if (item) {
                    const textarea = item.querySelector('.note-textarea-edit');
                    const note = notes.find(n => n.id === id);
                    if (textarea && note) {
                        textarea.value = note.text;
                        textarea.focus();
                        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
                    }
                }
            }

            function saveEdit(id) {
                const item = document.querySelector(`#${listId} .note-item[data-id="${id}"]`);
                if (item) {
                    const textarea = item.querySelector('.note-textarea-edit');
                    if (textarea) {
                        const text = textarea.value.trim();
                        if (!text) return;
                        const note = notes.find(n => n.id === id);
                        if (note) {
                            note.text = text;
                            editingId = null;
                            saveNotes();
                        }
                    }
                }
            }

            function cancelEdit() {
                editingId = null;
                render();
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function render() {
                const filtered = notes.filter(n =>
                    n.text.toLowerCase().includes(searchQuery.toLowerCase())
                );

                if (filtered.length === 0) {
                    list.innerHTML = `<div class="note-empty">${searchQuery ? '🔍 Ничего не найдено' : placeholder}</div>`;
                    countEl.textContent = `0 ${label}`;
                    return;
                }

                list.innerHTML = filtered.map(n => {
                    const isEditing = editingId === n.id;
                    const isPinned = n.pinned;
                    return `
                        <div class="note-item ${isPinned ? 'pinned' : ''} ${isEditing ? 'editing' : ''}" data-id="${n.id}">
                            <div class="note-text">${escapeHtml(n.text)}</div>
                            <textarea class="note-textarea-edit">${escapeHtml(n.text)}</textarea>
                            <div class="note-actions">
                                ${isEditing ? `
                                    <button class="save-edit-btn" onclick="window._saveEdit${listId}(${n.id})">💾</button>
                                    <button class="cancel-edit-btn" onclick="window._cancelEdit${listId}()">✖</button>
                                ` : `
                                    <button class="pin-btn ${isPinned ? 'pinned' : ''}" onclick="window._togglePin${listId}(${n.id})">📌</button>
                                    <button class="edit-btn" onclick="window._startEdit${listId}(${n.id})">✏️</button>
                                    <button class="delete-btn" onclick="window._deleteNote${listId}(${n.id})">🗑️</button>
                                `}
                            </div>
                        </div>
                    `;
                }).join('');

                countEl.textContent = `${filtered.length} ${label}`;
            }

            window[`_deleteNote${listId}`] = deleteNote;
            window[`_togglePin${listId}`] = togglePin;
            window[`_startEdit${listId}`] = startEdit;
            window[`_saveEdit${listId}`] = saveEdit;
            window[`_cancelEdit${listId}`] = cancelEdit;

            addBtn.addEventListener('click', addNote);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    addNote();
                }
            });

            search.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                render();
            });

            loadNotes();

            return { addNote, deleteNote, togglePin, startEdit, saveEdit, cancelEdit, render, loadNotes };
        }

        const notesApp = createNoteApp({
            storageKey: 'love_notes_app',
            listId: 'notesList',
            inputId: 'notesInput',
            addBtnId: 'notesAddBtn',
            searchId: 'notesSearch',
            countId: 'notesCount',
            placeholder: '📝 Нет заметок. Напиши что-нибудь!',
            label: 'заметок'
        });

        const wishesApp = createNoteApp({
            storageKey: 'love_wishes_app',
            listId: 'wishesList',
            inputId: 'wishesInput',
            addBtnId: 'wishesAddBtn',
            searchId: 'wishesSearch',
            countId: 'wishesCount',
            placeholder: '🌟 Нет пожеланий. Напиши что хочешь!',
            label: 'пожеланий'
        });

        if (typeof finalReasons !== 'undefined' && finalReasons.length > 0) {
            showReason(0);
        } else {
            reasonText.textContent = 'Загрузка...';
        }
    </script>
</body>
</html>
