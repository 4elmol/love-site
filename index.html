<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1001 причина гулять со мной ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #0d0b1a, #1b1236, #281d47);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(14px);
            border-radius: 40px;
            padding: 40px 30px;
            max-width: 880px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.25s ease;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .tab-btn:hover {
            background: rgba(255, 138, 172, 0.06);
            color: #fff;
        }
        .tab-btn.active {
            background: rgba(255, 138, 172, 0.12);
            border-color: #ff8aac;
            color: #ff8aac;
        }

        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        h1 {
            background: linear-gradient(135deg, #ff8aac, #c084fc, #7aa9ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .sub {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.95rem;
            letter-spacing: 5px;
            margin-top: 4px;
            margin-bottom: 22px;
            text-transform: uppercase;
        }
        .counter {
            display: inline-block;
            background: rgba(255, 138, 172, 0.08);
            border: 1px solid rgba(255, 138, 172, 0.15);
            color: #ff8aac;
            font-weight: 500;
            font-size: 0.85rem;
            padding: 6px 24px;
            border-radius: 40px;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        #card {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 24px;
            padding: 48px 28px;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            border-left: 4px solid #ff8aac;
            box-shadow: inset 0 0 50px rgba(255, 138, 172, 0.02);
        }
        #reasonText {
            color: #f2ecff;
            font-size: 1.7rem;
            line-height: 1.5;
            font-weight: 300;
            transition: opacity 0.2s ease;
        }

        .actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .actions button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #d6ccf0;
            padding: 14px 34px;
            border-radius: 60px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.25s ease;
            font-weight: 400;
            letter-spacing: 0.4px;
            backdrop-filter: blur(4px);
        }
        .actions button:hover {
            background: rgba(255, 138, 172, 0.10);
            border-color: #ff8aac;
            color: #fff;
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(255, 138, 172, 0.04);
        }

        .carousel-wrapper {
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 0;
            position: relative;
        }
        .carousel-track {
            display: flex;
            gap: 16px;
            animation: scrollPhotos 20s linear infinite;
            width: max-content;
        }
        .carousel-track img {
            height: 120px;
            width: 180px;
            object-fit: cover;
            border-radius: 12px;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.3s ease;
        }
        .carousel-track img:hover {
            transform: scale(1.05);
            border-color: #ff8aac;
        }

        @keyframes scrollPhotos {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        .carousel-wrapper:hover .carousel-track {
            animation-play-state: paused;
        }

        #progressWrap {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            margin-top: 28px;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff8aac, #c084fc, #7aa9ff);
            transition: width 0.6s ease;
        }
        .footer {
            color: rgba(255, 255, 255, 0.04);
            margin-top: 16px;
            font-size: 0.7rem;
            letter-spacing: 3px;
        }

        /* ===== ЗАМЕТКИ И ПОЖЕЛАНИЯ ===== */
        .note-app {
            text-align: left;
            margin-top: 10px;
        }
        .note-app .note-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .note-app .note-input-area textarea {
            flex: 1;
            min-height: 60px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            color: #f2ecff;
            font-size: 0.95rem;
            padding: 12px 16px;
            font-family: inherit;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            min-width: 150px;
        }
        .note-app .note-input-area textarea:focus {
            border-color: #c084fc;
            background: rgba(0, 0, 0, 0.3);
        }
        .note-app .note-input-area textarea::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }
        .note-app .note-input-area .note-add-btn {
            background: rgba(255, 138, 172, 0.08);
            border: 1px solid rgba(255, 138, 172, 0.15);
            color: #ff8aac;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.25s ease;
            white-space: nowrap;
            height: fit-content;
            align-self: flex-end;
        }
        .note-app .note-input-area .note-add-btn:hover {
            background: rgba(255, 138, 172, 0.15);
            border-color: #ff8aac;
            transform: scale(1.02);
        }
        .note-app .note-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .note-app .note-list::-webkit-scrollbar {
            width: 4px;
        }
        .note-app .note-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .note-app .note-list::-webkit-scrollbar-thumb {
            background: rgba(255, 138, 172, 0.2);
            border-radius: 10px;
        }
        .note-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: 0.2s ease;
        }
        .note-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .note-item.pinned {
            border-left: 3px solid #ff8aac;
            background: rgba(255, 138, 172, 0.04);
        }
        .note-item .note-text {
            color: #f2ecff;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            flex: 1;
        }
        .note-item .note-textarea-edit {
            display: none;
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 138, 172, 0.2);
            border-radius: 12px;
            color: #f2ecff;
            font-size: 0.95rem;
            padding: 8px 12px;
            font-family: inherit;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            min-height: 40px;
        }
        .note-item .note-textarea-edit:focus {
            border-color: #c084fc;
        }
        .note-item.editing .note-text {
            display: none;
        }
        .note-item.editing .note-textarea-edit {
            display: block;
        }
        .note-item .note-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .note-item .note-actions button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.3);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .note-item .note-actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .note-item .note-actions .edit-btn:hover {
            border-color: #c084fc;
            color: #c084fc;
        }
        .note-item .note-actions .delete-btn:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        .note-item .note-actions .pin-btn:hover {
            border-color: #ff8aac;
            color: #ff8aac;
        }
        .note-item .note-actions .pin-btn.pinned {
            border-color: #ff8aac;
            color: #ff8aac;
            background: rgba(255, 138, 172, 0.08);
        }
        .note-item .note-actions .save-edit-btn {
            border-color: rgba(132, 255, 132, 0.2);
            color: rgba(132, 255, 132, 0.5);
        }
        .note-item .note-actions .save-edit-btn:hover {
            border-color: #84ff84;
            color: #84ff84;
        }
        .note-item .note-actions .cancel-edit-btn:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        .note-empty {
            color: rgba(255, 255, 255, 0.1);
            text-align: center;
            padding: 30px 0;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }
            #reasonText {
                font-size: 1.2rem;
            }
            .container {
                padding: 22px 16px;
            }
            #card {
                padding: 30px 16px;
                min-height: 160px;
            }
            .carousel-track img {
                height: 80px;
                width: 120px;
            }
            .tab-btn {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
            .note-app .note-input-area {
                flex-direction: column;
            }
            .note-app .note-input-area .note-add-btn {
                align-self: stretch;
            }
            .note-item {
                flex-wrap: wrap;
            }
            .note-item .note-actions {
                margin-top: 8px;
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="tabs">
            <button class="tab-btn active" data-page="main">💕 Главная</button>
            <button class="tab-btn" data-page="notes">📝 Заметки</button>
            <button class="tab-btn" data-page="wishes">🌟 Пожелания</button>
        </div>

        <!-- ===== СТРАНИЦА 1: ГЛАВНАЯ ===== -->
        <div class="page active" id="page-main">
            <h1>1001 причина</h1>
            <div class="sub">пойти гулять со мной</div>
            <div class="counter" id="counterDisplay">1 / 1001</div>
            <div id="card">
                <div id="reasonText">Загрузка...</div>
            </div>
            <div class="actions">
                <button id="randomBtn">✦ Новая</button>
                <button id="nextBtn">→ Дальше</button>
            </div>
            <div class="carousel-wrapper">
                <div class="carousel-track" id="photoTrack"></div>
            </div>
            <div id="progressWrap">
                <div id="progressFill"></div>
            </div>
            <div class="footer">для тебя</div>
        </div>

        <!-- ===== СТРАНИЦА 2: ЗАМЕТКИ ===== -->
        <div class="page" id="page-notes">
            <h1>📝 Заметки</h1>
            <div class="sub">записывай свои мысли</div>
            <div class="note-app">
                <div class="note-input-area">
                    <textarea id="notesInput" placeholder="Напиши заметку..."></textarea>
                    <button class="note-add-btn" id="notesAddBtn">➕ Добавить</button>
                </div>
                <div class="note-list" id="notesList"></div>
            </div>
        </div>

        <!-- ===== СТРАНИЦА 3: ПОЖЕЛАНИЯ ===== -->
        <div class="page" id="page-wishes">
            <h1>🌟 Пожелания</h1>
            <div class="sub">что ты хочешь мне сказать</div>
            <div class="note-app">
                <div class="note-input-area">
                    <textarea id="wishesInput" placeholder="Напиши пожелание..."></textarea>
                    <button class="note-add-btn" id="wishesAddBtn">➕ Добавить</button>
                </div>
                <div class="note-list" id="wishesList"></div>
            </div>
        </div>

    </div>

    <script src="reasons.js"></script>
    <script>
        // =============================================================
        // 1. ФОТОГРАФИИ
        // =============================================================
        const photos = [
            "images/photo1.jpg",
            "images/photo2.jpg",
            "images/photo3.jpg",
            "images/photo4.jpg",
            "images/photo5.jpg",
            "images/photo6.jpg",
            "images/photo7.jpg",
            "images/photo8.jpg",
            "images/photo9.jpg",
            "images/photo10.jpg",
            "images/photo11.jpg",
            "images/photo12.jpg",
            "images/photo13.jpg",
            "images/photo14.jpg",
            "images/photo15.jpg",
            "images/photo16.jpg",
            "images/photo17.jpg",
            "images/photo18.jpg"
        ];

        const track = document.getElementById('photoTrack');
        const allPhotos = [...photos, ...photos];
        allPhotos.forEach(src => {
            const img = document.createElement('img');
            img.src = src;
            img.alt = 'Красивое фото';
            img.loading = 'lazy';
            track.appendChild(img);
        });

        // =============================================================
        // 2. ЛОГИКА ПРИЧИН
        // =============================================================
        let currentIndex = 0;
        const reasonText = document.getElementById('reasonText');
        const counterDisplay = document.getElementById('counterDisplay');
        const progressFill = document.getElementById('progressFill');

        function showReason(index) {
            const safe = index % finalReasons.length;
            currentIndex = safe;
            reasonText.textContent = finalReasons[safe];
            counterDisplay.textContent = `${safe + 1} / ${finalReasons.length}`;
            progressFill.style.width = ((safe + 1) / finalReasons.length * 100) + '%';
            reasonText.style.opacity = '0';
            setTimeout(() => reasonText.style.opacity = '1', 140);
        }

        document.getElementById('randomBtn').addEventListener('click', () => {
            showReason(Math.floor(Math.random() * finalReasons.length));
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            showReason((currentIndex + 1) % finalReasons.length);
        });

        // =============================================================
        // 3. ВКЛАДКИ
        // =============================================================
        const tabBtns = document.querySelectorAll('.tab-btn');
        const pages = {
            main: document.getElementById('page-main'),
            notes: document.getElementById('page-notes'),
            wishes: document.getElementById('page-wishes')
        };

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                Object.values(pages).forEach(p => p.classList.remove('active'));

                btn.classList.add('active');
                const pageId = btn.dataset.page;
                pages[pageId].classList.add('active');
            });
        });

        // =============================================================
        // 4. ЗАМЕТКИ И ПОЖЕЛАНИЯ (ОТДЕЛЬНЫЕ ФУНКЦИИ)
        // =============================================================

        // --- ХРАНИЛИЩА ---
        let notesData = JSON.parse(localStorage.getItem('love_notes') || '[]');
        let wishesData = JSON.parse(localStorage.getItem('love_wishes') || '[]');

        let notesEditingIndex = null;
        let wishesEditingIndex = null;

        // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // --- РЕНДЕР ЗАМЕТОК ---
        function renderNotes() {
            const list = document.getElementById('notesList');
            if (notesData.length === 0) {
                list.innerHTML = `<div class="note-empty">📝 Нет заметок. Напиши что-нибудь!</div>`;
                return;
            }

            const sorted = [...notesData].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

            list.innerHTML = sorted.map((n, sortedIndex) => {
                const realIndex = notesData.indexOf(n);
                const isEditing = notesEditingIndex === realIndex;
                const isPinned = n.pinned || false;

                return `
                    <div class="note-item ${isPinned ? 'pinned' : ''} ${isEditing ? 'editing' : ''}">
                        <div class="note-text">${escapeHtml(n.text)}</div>
                        <textarea class="note-textarea-edit">${escapeHtml(n.text)}</textarea>
                        <div class="note-actions">
                            ${isEditing ? `
                                <button class="save-edit-btn" onclick="saveNoteEdit(${realIndex})">💾</button>
                                <button class="cancel-edit-btn" onclick="cancelNoteEdit()">✖</button>
                            ` : `
                                <button class="pin-btn ${isPinned ? 'pinned' : ''}" onclick="toggleNotePin(${realIndex})">📌</button>
                                <button class="edit-btn" onclick="startNoteEdit(${realIndex})">✏️</button>
                                <button class="delete-btn" onclick="deleteNote(${realIndex})">🗑️</button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- РЕНДЕР ПОЖЕЛАНИЙ ---
        function renderWishes() {
            const list = document.getElementById('wishesList');
            if (wishesData.length === 0) {
                list.innerHTML = `<div class="note-empty">🌟 Нет пожеланий. Напиши что хочешь!</div>`;
                return;
            }

            const sorted = [...wishesData].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

            list.innerHTML = sorted.map((n, sortedIndex) => {
                const realIndex = wishesData.indexOf(n);
                const isEditing = wishesEditingIndex === realIndex;
                const isPinned = n.pinned || false;

                return `
                    <div class="note-item ${isPinned ? 'pinned' : ''} ${isEditing ? 'editing' : ''}">
                        <div class="note-text">${escapeHtml(n.text)}</div>
                        <textarea class="note-textarea-edit">${escapeHtml(n.text)}</textarea>
                        <div class="note-actions">
                            ${isEditing ? `
                                <button class="save-edit-btn" onclick="saveWishEdit(${realIndex})">💾</button>
                                <button class="cancel-edit-btn" onclick="cancelWishEdit()">✖</button>
                            ` : `
                                <button class="pin-btn ${isPinned ? 'pinned' : ''}" onclick="toggleWishPin(${realIndex})">📌</button>
                                <button class="edit-btn" onclick="startWishEdit(${realIndex})">✏️</button>
                                <button class="delete-btn" onclick="deleteWish(${realIndex})">🗑️</button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- ФУНКЦИИ ДЛЯ ЗАМЕТОК ---
        function addNote() {
            const input = document.getElementById('notesInput');
            const text = input.value.trim();
            if (!text) return;
            notesData.push({ text: text, pinned: false, date: new Date().toLocaleString() });
            localStorage.setItem('love_notes', JSON.stringify(notesData));
            input.value = '';
            notesEditingIndex = null;
            renderNotes();
        }

        window.deleteNote = function(index) {
            notesData.splice(index, 1);
            localStorage.setItem('love_notes', JSON.stringify(notesData));
            notesEditingIndex = null;
            renderNotes();
        };

        window.toggleNotePin = function(index) {
            notesData[index].pinned = !notesData[index].pinned;
            localStorage.setItem('love_notes', JSON.stringify(notesData));
            renderNotes();
        };

        window.startNoteEdit = function(index) {
            notesEditingIndex = index;
            renderNotes();
            setTimeout(() => {
                const items = document.querySelectorAll('#notesList .note-item');
                const item = items[index];
                if (item) {
                    const textarea = item.querySelector('.note-textarea-edit');
                    if (textarea) {
                        textarea.focus();
                        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
                    }
                }
            }, 100);
        };

        window.saveNoteEdit = function(index) {
            const items = document.querySelectorAll('#notesList .note-item');
            const item = items[index];
            if (item) {
                const textarea = item.querySelector('.note-textarea-edit');
                if (textarea) {
                    const text = textarea.value.trim();
                    if (!text) return;
                    notesData[index].text = text;
                    localStorage.setItem('love_notes', JSON.stringify(notesData));
                    notesEditingIndex = null;
                    renderNotes();
                }
            }
        };

        window.cancelNoteEdit = function() {
            notesEditingIndex = null;
            renderNotes();
        };

        // --- ФУНКЦИИ ДЛЯ ПОЖЕЛАНИЙ ---
        function addWish() {
            const input = document.getElementById('wishesInput');
            const text = input.value.trim();
            if (!text) return;
            wishesData.push({ text: text, pinned: false, date: new Date().toLocaleString() });
            localStorage.setItem('love_wishes', JSON.stringify(wishesData));
            input.value = '';
            wishesEditingIndex = null;
            renderWishes();
        }

        window.deleteWish = function(index) {
            wishesData.splice(index, 1);
            localStorage.setItem('love_wishes', JSON.stringify(wishesData));
            wishesEditingIndex = null;
            renderWishes();
        };

        window.toggleWishPin = function(index) {
            wishesData[index].pinned = !wishesData[index].pinned;
            localStorage.setItem('love_wishes', JSON.stringify(wishesData));
            renderWishes();
        };

        window.startWishEdit = function(index) {
            wishesEditingIndex = index;
            renderWishes();
            setTimeout(() => {
                const items = document.querySelectorAll('#wishesList .note-item');
                const item = items[index];
                if (item) {
                    const textarea = item.querySelector('.note-textarea-edit');
                    if (textarea) {
                        textarea.focus();
                        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
                    }
                }
            }, 100);
        };

        window.saveWishEdit = function(index) {
            const items = document.querySelectorAll('#wishesList .note-item');
            const item = items[index];
            if (item) {
                const textarea = item.querySelector('.note-textarea-edit');
                if (textarea) {
                    const text = textarea.value.trim();
                    if (!text) return;
                    wishesData[index].text = text;
                    localStorage.setItem('love_wishes', JSON.stringify(wishesData));
                    wishesEditingIndex = null;
                    renderWishes();
                }
            }
        };

        window.cancelWishEdit = function() {
            wishesEditingIndex = null;
            renderWishes();
        };

        // --- ПОДКЛЮЧАЕМ СОБЫТИЯ ---
        document.getElementById('notesAddBtn').addEventListener('click', addNote);
        document.getElementById('notesInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                addNote();
            }
        });

        document.getElementById('wishesAddBtn').addEventListener('click', addWish);
        document.getElementById('wishesInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                addWish();
            }
        });

        // --- ЗАПУСК ---
        renderNotes();
        renderWishes();

        if (typeof finalReasons !== 'undefined' && finalReasons.length > 0) {
            showReason(0);
        } else {
            reasonText.textContent = 'Загрузка...';
        }
    </script>
</body>
</html>
