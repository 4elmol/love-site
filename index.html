<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1001 причина ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0d0b1a, #1b1236, #281d47);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            border-radius: 40px;
            padding: 40px 30px;
            max-width: 880px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }
        .tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.25s ease;
            font-weight: 500;
        }
        .tab-btn:hover { background: rgba(255, 138, 172, 0.06); color: #fff; }
        .tab-btn.active {
            background: rgba(255, 138, 172, 0.12);
            border-color: #ff8aac;
            color: #ff8aac;
        }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        h1 {
            background: linear-gradient(135deg, #ff8aac, #c084fc, #7aa9ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.8rem;
            font-weight: 600;
        }
        .sub {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.95rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 22px;
        }
        .counter {
            display: inline-block;
            background: rgba(255, 138, 172, 0.08);
            border: 1px solid rgba(255, 138, 172, 0.15);
            color: #ff8aac;
            font-weight: 500;
            font-size: 0.85rem;
            padding: 6px 24px;
            border-radius: 40px;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }
        #card {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 24px;
            padding: 48px 28px;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            border-left: 4px solid #ff8aac;
        }
        #reasonText {
            color: #f2ecff;
            font-size: 1.7rem;
            line-height: 1.5;
            font-weight: 300;
            transition: opacity 0.2s ease;
        }
        .actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .actions button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #d6ccf0;
            padding: 14px 34px;
            border-radius: 60px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.25s ease;
            font-weight: 400;
            backdrop-filter: blur(4px);
        }
        .actions button:hover {
            background: rgba(255, 138, 172, 0.10);
            border-color: #ff8aac;
            color: #fff;
            transform: scale(1.03);
        }
        .carousel-wrapper {
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 0;
        }
        .carousel-track {
            display: flex;
            gap: 16px;
            animation: scrollPhotos 20s linear infinite;
            width: max-content;
        }
        .carousel-track img {
            height: 120px;
            width: 180px;
            object-fit: cover;
            border-radius: 12px;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.3s ease;
        }
        .carousel-track img:hover {
            transform: scale(1.05);
            border-color: #ff8aac;
        }
        @keyframes scrollPhotos {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .carousel-wrapper:hover .carousel-track { animation-play-state: paused; }
        #progressWrap {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            margin-top: 28px;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff8aac, #c084fc, #7aa9ff);
            transition: width 0.6s ease;
        }
        .footer {
            color: rgba(255, 255, 255, 0.04);
            margin-top: 16px;
            font-size: 0.7rem;
            letter-spacing: 3px;
        }
        .note-app { text-align: left; margin-top: 10px; }
        .note-app .note-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .note-app .note-input-area textarea {
            flex: 1;
            min-height: 60px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            color: #f2ecff;
            font-size: 0.95rem;
            padding: 12px 16px;
            font-family: inherit;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            min-width: 150px;
        }
        .note-app .note-input-area textarea:focus {
            border-color: #c084fc;
            background: rgba(0, 0, 0, 0.3);
        }
        .note-app .note-input-area textarea::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }
        .note-app .note-input-area .note-add-btn {
            background: rgba(255, 138, 172, 0.08);
            border: 1px solid rgba(255, 138, 172, 0.15);
            color: #ff8aac;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.25s ease;
            white-space: nowrap;
            height: fit-content;
            align-self: flex-end;
        }
        .note-app .note-input-area .note-add-btn:hover {
            background: rgba(255, 138, 172, 0.15);
            border-color: #ff8aac;
        }
        .note-app .note-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .note-app .note-list::-webkit-scrollbar {
            width: 4px;
        }
        .note-app .note-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .note-app .note-list::-webkit-scrollbar-thumb {
            background: rgba(255, 138, 172, 0.2);
            border-radius: 10px;
        }
        .note-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: 0.2s ease;
        }
        .note-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .note-item .note-text {
            color: #f2ecff;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            flex: 1;
        }
        .note-item .note-actions button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.3);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .note-item .note-actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .note-item .note-actions .delete-btn:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        .note-empty {
            color: rgba(255, 255, 255, 0.1);
            text-align: center;
            padding: 30px 0;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        @media (max-width: 640px) {
            .container { padding: 22px 16px; }
            h1 { font-size: 2rem; }
            #reasonText { font-size: 1.2rem; }
            #card { padding: 30px 16px; min-height: 160px; }
            .carousel-track img { height: 80px; width: 120px; }
            .tab-btn { padding: 8px 16px; font-size: 0.8rem; }
            .note-app .note-input-area { flex-direction: column; }
            .note-app .note-input-area .note-add-btn { align-self: stretch; }
            .note-item { flex-wrap: wrap; }
            .note-item .note-actions { margin-top: 8px; width: 100%; justify-content: flex-end; }
        }
        @media (max-width: 480px) {
            .container { padding: 14px 10px !important; }
            h1 { font-size: 1.4rem !important; }
            #reasonText { font-size: 0.95rem !important; }
            .sub { font-size: 0.6rem !important; letter-spacing: 3px !important; }
            .counter { font-size: 0.65rem !important; padding: 4px 12px !important; }
            .tab-btn { font-size: 0.65rem !important; padding: 6px 10px !important; }
            #card { padding: 18px 12px !important; min-height: 100px !important; }
            .actions button { font-size: 0.7rem !important; padding: 8px 14px !important; min-width: 60px !important; }
            .carousel-track img { height: 55px !important; width: 85px !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" data-page="main">💕 Главная</button>
            <button class="tab-btn" data-page="notes">📝 Заметки</button>
            <button class="tab-btn" data-page="wishes">🌟 Пожелания</button>
        </div>

        <div class="page active" id="page-main">
            <h1>1001 причина</h1>
            <div class="sub">пойти гулять со мной</div>
            <div class="counter" id="counterDisplay">1 / 1001</div>
            <div id="card"><div id="reasonText">Нажми «Новая» ✦</div></div>
            <div class="actions">
                <button id="randomBtn">✦ Новая</button>
                <button id="nextBtn">→ Дальше</button>
            </div>
            <div class="carousel-wrapper">
                <div class="carousel-track" id="photoTrack"></div>
            </div>
            <div id="progressWrap"><div id="progressFill"></div></div>
            <div class="footer">для тебя</div>
        </div>

        <div class="page" id="page-notes">
            <h1>📝 Заметки</h1>
            <div class="sub">записывай свои мысли</div>
            <div class="note-app">
                <div class="note-input-area">
                    <textarea id="notesInput" placeholder="Напиши заметку..."></textarea>
                    <button class="note-add-btn" id="notesAddBtn">➕ Добавить</button>
                </div>
                <div class="note-list" id="notesList"></div>
            </div>
        </div>

        <div class="page" id="page-wishes">
            <h1>🌟 Пожелания</h1>
            <div class="sub">что ты хочешь мне сказать</div>
            <div class="note-app">
                <div class="note-input-area">
                    <textarea id="wishesInput" placeholder="Напиши пожелание..."></textarea>
                    <button class="note-add-btn" id="wishesAddBtn">➕ Добавить</button>
                </div>
                <div class="note-list" id="wishesList"></div>
            </div>
        </div>
    </div>

    <script>
        // =============================================================
        // ⚠️ ССЫЛКА НА GOOGLE SHEETS (уже вставлена!)
        // =============================================================
        var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxd_xQQBZyrxbTFGZ_428_Fcl_WrDzKLHL7y950_PiT6YtizkV_h-EuMI42c6eLVq5/exec';

        // =============================================================
        // 1001 ПРИЧИНА
        // =============================================================
        var baseReasons = [
            "Чтобы я мог смотреть в твои глаза", "Я хочу услышать твой смех вживую",
            "Потому что в тишине между нами рождается что-то интересное",
            "Я хочу запомнить, как пахнут твои волосы",
            "Чтобы мы вместе посмеялись над чем-то, что поймём только мы",
            "Я хочу показать тебе, что я умею слушать",
            "Потому что с тобой даже обычный день становится приключением",
            "Я хочу увидеть, как ты смотришь на мир",
            "Чтобы я мог сказать тебе «ты красивая» вживую",
            "Я хочу, чтобы ты почувствовала себя самой важной на свете",
            "Потому что я хочу узнать, что делает тебя счастливой",
            "Я хочу держать тебя за руку и молчать",
            "Чтобы ты увидела меня настоящего — без масок",
            "Я хочу, чтобы ты знала: рядом с тобой я чувствую себя лучше",
            "Потому что я хочу создать с тобой воспоминания",
            "Я хочу слушать, как ты рассказываешь о мечтах",
            "Чтобы мы вместе придумали секрет, который останется только у нас",
            "Я хочу увидеть твою улыбку, когда ты поймёшь, что я серьёзно",
            "Потому что я хочу быть тем, кто согреет тебя в холодный вечер",
            "Я хочу, чтобы ты знала: я выбрал тебя не случайно",
            "Чтобы мы могли говорить о важном и о пустяках",
            "Я хочу чувствовать твоё дыхание рядом",
            "Потому что я хочу, чтобы ты улыбнулась, вспоминая меня",
            "Я хочу показать тебе, какой я бываю нежным",
            "Чтобы ты поняла: я не боюсь быть уязвимым рядом с тобой",
            "Я хочу узнать твои маленькие привычки",
            "Потому что я хочу стать частью твоего дня",
            "Я хочу смотреть на закат и видеть отражение твоих глаз",
            "Чтобы мы вместе искали красивое в обычных вещах",
            "Я хочу, чтобы ты знала: я готов ждать тебя сколько угодно",
            "Потому что я хочу, чтобы ты была моим уютом",
            "Я хочу, чтобы ты смеялась надо мной, а я — над собой",
            "Чтобы я мог сказать тебе «спасибо» за то, что ты есть",
            "Я хочу узнать, о чём ты думаешь, когда смотришь в окно",
            "Потому что я хочу быть тем, кто заставит тебя поверить в чудо",
            "Я хочу, чтобы ты чувствовала себя в безопасности рядом со мной",
            "Чтобы мы вместе создали что-то, что не разрушит время",
            "Я хочу слышать твой голос вживую",
            "Потому что я хочу, чтобы ты знала: ты — моя лучшая мысль",
            "Я хочу, чтобы ты улыбнулась, и мир стал ярче",
            "Чтобы мы могли молчать вместе, и это не было странно",
            "Я хочу, чтобы ты увидела мои глаза, когда я смотрю на тебя",
            "Потому что я хочу быть тем, кто скажет тебе правду",
            "Я хочу, чтобы ты запомнила этот день как начало",
            "Чтобы мы вместе пошли туда, где нет интернета, а есть мы",
            "Я хочу, чтобы ты знала: я горжусь тем, что я рядом с тобой",
            "Потому что я хочу, чтобы ты была счастлива — и я стал причиной",
            "Я хочу, чтобы ты чувствовала себя желанной и нужной",
            "Чтобы мы вместе посмотрели на звёзды и придумали свою",
            "Я хочу, чтобы ты знала: ты — единственная, кто заставляет меня улыбаться"
        ];

        var prefixes = [
            "Твоя улыбка", "Твой смех", "Твой голос", "Твой взгляд",
            "Твоя искренность", "Твоя теплота", "Твоя энергия", "Твоя лёгкость"
        ];

        var finalReasons = [];
        for (var i = 0; i < baseReasons.length; i++) {
            finalReasons.push(baseReasons[i]);
        }

        while (finalReasons.length < 1001) {
            var base = baseReasons[Math.floor(Math.random() * baseReasons.length)];
            var prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            var newReason = prefix + " — " + base.toLowerCase();
            if (finalReasons.indexOf(newReason) === -1) {
                finalReasons.push(newReason);
            }
        }

        // =============================================================
        // ФОТО
        // =============================================================
        var photos = [
            "images/photo1.jpg", "images/photo2.jpg", "images/photo3.jpg",
            "images/photo4.jpg", "images/photo5.jpg", "images/photo6.jpg",
            "images/photo7.jpg", "images/photo8.jpg", "images/photo9.jpg",
            "images/photo10.jpg", "images/photo11.jpg", "images/photo12.jpg",
            "images/photo13.jpg", "images/photo14.jpg", "images/photo15.jpg",
            "images/photo16.jpg", "images/photo17.jpg", "images/photo18.jpg"
        ];

        var track = document.getElementById('photoTrack');
        var allPhotos = photos.concat(photos);
        for (var i = 0; i < allPhotos.length; i++) {
            var img = document.createElement('img');
            img.src = allPhotos[i];
            img.alt = 'Фото';
            img.loading = 'lazy';
            track.appendChild(img);
        }

        // =============================================================
        // ЛОГИКА ПРИЧИН
        // =============================================================
        var currentIndex = 0;
        var reasonText = document.getElementById('reasonText');
        var counterDisplay = document.getElementById('counterDisplay');
        var progressFill = document.getElementById('progressFill');

        function showReason(index) {
            var safe = index % finalReasons.length;
            currentIndex = safe;
            reasonText.textContent = finalReasons[safe];
            counterDisplay.textContent = (safe + 1) + ' / ' + finalReasons.length;
            progressFill.style.width = ((safe + 1) / finalReasons.length * 100) + '%';
            reasonText.style.opacity = '0';
            setTimeout(function() { reasonText.style.opacity = '1'; }, 140);
        }

        document.getElementById('randomBtn').addEventListener('click', function() {
            showReason(Math.floor(Math.random() * finalReasons.length));
        });

        document.getElementById('nextBtn').addEventListener('click', function() {
            showReason((currentIndex + 1) % finalReasons.length);
        });

        // =============================================================
        // ВКЛАДКИ
        // =============================================================
        var tabBtns = document.querySelectorAll('.tab-btn');
        var pages = {
            main: document.getElementById('page-main'),
            notes: document.getElementById('page-notes'),
            wishes: document.getElementById('page-wishes')
        };

        for (var i = 0; i < tabBtns.length; i++) {
            tabBtns[i].addEventListener('click', function() {
                for (var j = 0; j < tabBtns.length; j++) {
                    tabBtns[j].classList.remove('active');
                }
                this.classList.add('active');
                for (var key in pages) {
                    pages[key].classList.remove('active');
                }
                var pageId = this.dataset.page;
                pages[pageId].classList.add('active');
            });
        }

        // =============================================================
        // ОТПРАВКА В GOOGLE SHEETS
        // =============================================================
        async function sendToGoogleSheets(type, text) {
            try {
                var response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: type, text: text })
                });
                return true;
            } catch (error) {
                console.error('Ошибка отправки:', error);
                return false;
            }
        }

        // =============================================================
        // ЗАМЕТКИ
        // =============================================================
        var notesData = [];

        function renderNotes() {
            var list = document.getElementById('notesList');
            if (notesData.length === 0) {
                list.innerHTML = '<div class="note-empty">📝 Нет заметок. Напиши что-нибудь!</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < notesData.length; i++) {
                var n = notesData[i];
                html += '<div class="note-item">';
                html += '<div class="note-text">' + n.text + '</div>';
                html += '<div class="note-actions"><button class="delete-btn" onclick="deleteNote(' + i + ')">🗑️</button></div>';
                html += '</div>';
            }
            list.innerHTML = html;
        }

        async function addNote() {
            var input = document.getElementById('notesInput');
            var text = input.value.trim();
            if (!text) return;

            var success = await sendToGoogleSheets('note', text);
            if (success) {
                notesData.push({ text: text });
                input.value = '';
                renderNotes();
            } else {
                alert('Не удалось сохранить заметку. Проверь интернет.');
            }
        }

        window.deleteNote = function(index) {
            notesData.splice(index, 1);
            renderNotes();
        };

        document.getElementById('notesAddBtn').addEventListener('click', addNote);
        document.getElementById('notesInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                addNote();
            }
        });

        // =============================================================
        // ПОЖЕЛАНИЯ
        // =============================================================
        var wishesData = [];

        function renderWishes() {
            var list = document.getElementById('wishesList');
            if (wishesData.length === 0) {
                list.innerHTML = '<div class="note-empty">🌟 Нет пожеланий. Напиши что хочешь!</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < wishesData.length; i++) {
                var w = wishesData[i];
                html += '<div class="note-item">';
                html += '<div class="note-text">' + w.text + '</div>';
                html += '<div class="note-actions"><button class="delete-btn" onclick="deleteWish(' + i + ')">🗑️</button></div>';
                html += '</div>';
            }
            list.innerHTML = html;
        }

        async function addWish() {
            var input = document.getElementById('wishesInput');
            var text = input.value.trim();
            if (!text) return;

            var success = await sendToGoogleSheets('wish', text);
            if (success) {
                wishesData.push({ text: text });
                input.value = '';
                renderWishes();
            } else {
                alert('Не удалось сохранить пожелание. Проверь интернет.');
            }
        }

        window.deleteWish = function(index) {
            wishesData.splice(index, 1);
            renderWishes();
        };

        document.getElementById('wishesAddBtn').addEventListener('click', addWish);
        document.getElementById('wishesInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                addWish();
            }
        });

        // =============================================================
        // СТАРТ
        // =============================================================
        if (finalReasons.length > 0) {
            showReason(0);
        }
    </script>
</body>
</html>
