        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadNotes(type) {
            var result = await supabase
                .from('notes')
                .select('*')
                .eq('type', type)
                .order('created_at', { ascending: false });
            if (result.error) {
                console.error('Ошибка загрузки:', result.error);
                return [];
            }
            return result.data || [];
        }

        async function addNoteToSupabase(type, text) {
            var result = await supabase
                .from('notes')
                .insert([{ type: type, text: text, pinned: false }])
                .select();
            if (result.error) {
                console.error('Ошибка добавления:', result.error);
                return null;
            }
            return result.data[0];
        }

        async function deleteNoteFromSupabase(id) {
            var result = await supabase
                .from('notes')
                .delete()
                .eq('id', id);
            if (result.error) {
                console.error('Ошибка удаления:', result.error);
                return false;
            }
            return true;
        }

        async function updateNoteInSupabase(id, updates) {
            var result = await supabase
                .from('notes')
                .update(updates)
                .eq('id', id);
            if (result.error) {
                console.error('Ошибка обновления:', result.error);
                return false;
            }
            return true;
        }

        var notesData = [];

        function renderNotes() {
            var list = document.getElementById('notesList');
            if (notesData.length === 0) {
                list.innerHTML = '<div class="note-empty">📝 Нет заметок. Напиши что-нибудь!</div>';
                return;
            }
            var sorted = notesData.slice().sort(function(a, b) {
                return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
            });
            var html = '';
            for (var i = 0; i < sorted.length; i++) {
                var n = sorted[i];
                var isEditing = notesEditingId === n.id;
                var isPinned = n.pinned || false;
                html += '<div class="note-item ' + (isPinned ? 'pinned' : '') + ' ' + (isEditing ? 'editing' : '') + '">';
                html += '<div class="note-text">' + escapeHtml(n.text) + '</div>';
                html += '<textarea class="note-textarea-edit">' + escapeHtml(n.text) + '</textarea>';
                html += '<div class="note-actions">';
                if (isEditing) {
                    html += '<button class="save-edit-btn" onclick="saveNoteEdit(\'' + n.id + '\')">💾</button>';
                    html += '<button class="cancel-edit-btn" onclick="cancelNoteEdit()">✖</button>';
                } else {
                    html += '<button class="pin-btn ' + (isPinned ? 'pinned' : '') + '" onclick="toggleNotePin(\'' + n.id + '\', ' + n.pinned + ')">📌</button>';
                    html += '<button class="edit-btn" onclick="startNoteEdit(\'' + n.id + '\')">✏️</button>';
                    html += '<button class="delete-btn" onclick="deleteNote(\'' + n.id + '\')">🗑️</button>';
                }
                html += '</div></div>';
            }
            list.innerHTML = html;
        }

        async function addNote() {
            var input = document.getElementById('notesInput');
            var text = input.value.trim();
            if (!text) return;
            var newNote = await addNoteToSupabase('note', text);
            if (newNote) {
                notesData.unshift(newNote);
                input.value = '';
                renderNotes();
            }
        }

        window.deleteNote = async function(id) {
            var success = await deleteNoteFromSupabase(id);
            if (success) {
                var newData = [];
                for (var i = 0; i < notesData.length; i++) {
                    if (notesData[i].id !== id) {
                        newData.push(notesData[i]);
                    }
                }
                notesData = newData;
                notesEditingId = null;
                renderNotes();
            }
        };

        window.toggleNotePin = async function(id, currentPinned) {
            var success = await updateNoteInSupabase(id, { pinned: !currentPinned });
            if (success) {
                for (var i = 0; i < notesData.length; i++) {
                    if (notesData[i].id === id) {
                        notesData[i].pinned = !notesData[i].pinned;
                        break;
                    }
                }
                renderNotes();
            }
        };

        window.startNoteEdit = function(id) {
            notesEditingId = id;
            renderNotes();
            setTimeout(function() {
                var items = document.querySelectorAll('#notesList .note-item');
                var found = null;
                for (var i = 0; i < items.length; i++) {
                    if (items[i].querySelector('.note-textarea-edit')) {
                        found = items[i];
                        break;
                    }
                }
                if (found) {
                    var textarea = found.querySelector('.note-textarea-edit');
                    if (textarea) {
                        textarea.focus();
                        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
                    }
                }
            }, 100);
        };

        window.saveNoteEdit = async function(id) {
            var items = document.querySelectorAll('#notesList .note-item');
            var found = null;
            for (var i = 0; i < items.length; i++) {
                if (items[i].querySelector('.note-textarea-edit')) {
                    found = items[i];
                    break;
                }
            }
            if (found) {
                var textarea = found.querySelector('.note-textarea-edit');
                if (textarea) {
                    var text = textarea.value.trim();
                    if (!text) return;
                    var success = await updateNoteInSupabase(id, { text: text });
                    if (success) {
                        for (var i = 0; i < notesData.length; i++) {
                            if (notesData[i].id === id) {
                                notesData[i].text = text;
                                break;
                            }
                        }
                        notesEditingId = null;
                        renderNotes();
                    }
                }
            }
        };

            if (success) {
                for (var i = 0; i < wishesData.length; i++) {
                    if (wishesData[i].id === id) {
                        wishesData[i].pinned = !wishesData[i].pinned;
                        break;
                    }
                }
                renderWishes();
            }
        };

        window.startWishEdit = function(id) {
            wishesEditingId = id;
            renderWishes();
            setTimeout(function() {
                var items = document.querySelectorAll('#wishesList .note-item');
                var found = null;
                for (var i = 0; i < items.length; i++) {
                    if (items[i].querySelector('.note-textarea-edit')) {
                        found = items[i];
                        break;
                    }
                }
                if (found) {
                    var textarea = found.querySelector('.note-textarea-edit');
                    if (textarea) {
                        textarea.focus();
                        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
                    }
                }
            }, 100);
        };

        window.saveWishEdit = async function(id) {
            var items = document.querySelectorAll('#wishesList .note-item');
            var found = null;
            for (var i = 0; i < items.length; i++) {
                if (items[i].querySelector('.note-textarea-edit')) {
                    found = items[i];
                    break;
                }
            }
            if (found) {
                var textarea = found.querySelector('.note-textarea-edit');
                if (textarea) {
                    var text = textarea.value.trim();
                    if (!text) return;
                    var success = await updateNoteInSupabase(id, { text: text });
                    if (success) {
                        for (var i = 0; i < wishesData.length; i++) {
                            if (wishesData[i].id === id) {
                                wishesData[i].text = text;
                                break;
                            }
                        }
                        wishesEditingId = null;
                        renderWishes();
                    }
                }
            }
        };

        window.cancelWishEdit = function() {
            wishesEditingId = null;
            renderWishes();
        };

        // ===== ПОДКЛЮЧАЕМ СОБЫТИЯ =====
        document.getElementById('notesAddBtn').addEventListener('click', addNote);
        document.getElementById('notesInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                addNote();
            }
        });

        document.getElementById('wishesAddBtn').addEventListener('click', addWish);
        document.getElementById('wishesInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                addWish();
            }
        });

        // ===== ЗАГРУЗКА ДАННЫХ =====
        async function loadAllData() {
            notesData = await loadNotes('note');
            wishesData = await loadNotes('wish');
            renderNotes();
            renderWishes();
        }

        loadAllData();

        // ===== СТАРТ =====
        if (finalReasons.length > 0) {
            showReason(0);
        } else {
            reasonText.textContent = 'Загрузка...';
        }
    </script>
</body>
</html>
